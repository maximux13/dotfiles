#!/usr/bin/env bash
# =============================================================================
# paths.conf - Secrets paths configuration for Mac backup system
# =============================================================================
# This file defines which directories and files contain sensitive data that
# should be backed up securely (encrypted).
#
# HOW TO ADD MORE PATHS:
# ----------------------
# Simply add new paths to the SECRETS_PATHS array below. Each path should be
# on its own line for easy maintenance. Paths can be:
#   - Directories (e.g., ~/.ssh)
#   - Individual files (e.g., ~/.gitconfig)
#   - Use ~ for home directory (will be expanded)
#
# NOTES:
# ------
# - Missing paths are automatically skipped during backup
# - Paths are relative to home directory when using ~
# - Do not include trailing slashes on directories
# =============================================================================

SECRETS_PATHS=(
    # SSH keys and configuration
    ~/.ssh

    # AWS credentials and configuration
    ~/.aws

    # GPG keys and trust database
    ~/.gnupg

    # Network authentication credentials
    ~/.netrc

    # NPM authentication token
    ~/.npmrc

    # GitHub CLI configuration and authentication
    ~/.config/gh

    # -------------------------------------------------------------------------
    # Shell & tool history (may contain sensitive commands/tokens)
    # -------------------------------------------------------------------------
    ~/.zsh_history
    ~/.bash_history
    ~/.python_history
    ~/.viminfo
    ~/.lesshst

    # -------------------------------------------------------------------------
    # ADD YOUR CUSTOM PATHS BELOW
    # -------------------------------------------------------------------------
    # Example entries:
    # ~/.config/hub          # Hub CLI configuration
    # ~/.docker/config.json  # Docker registry credentials
    # ~/.kube                 # Kubernetes configuration
    # ~/.terraform.d         # Terraform credentials
    # ~/.vault-token         # HashiCorp Vault token
    # ~/.config/gcloud       # Google Cloud credentials
    # -------------------------------------------------------------------------
)
